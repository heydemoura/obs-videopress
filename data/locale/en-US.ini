VideoPress.AddSite.CredentialsHeading="<b>Connect %1 with an application password</b>"
VideoPress.AddSite.Intro="OBS signs in to <b>%1</b> with an <b>application password</b>: a separate password just for OBS that you can revoke at any time. VideoPress always stores your videos on WordPress.com, so your user also needs to be connected to WordPress.com in Jetpack."
VideoPress.AddSite.OpenPasswords="Open Application Passwords on %1 ↗"
VideoPress.AddSite.Steps="<ol><li>Click the button above to open your site's Application Passwords page in your browser. If application passwords are turned off, enable them there first.</li><li>Name the new password <i>OBS</i> and add it.</li><li>Copy the generated password and paste it below, together with your username.</li></ol>"
VideoPress.AddSite.IntroWordPressCom="<b>%1</b> is hosted on WordPress.com, which keeps application passwords switched off on this site until you activate them. Activating them moves the site to WordPress.com's managed cloud hosting, and depending on your plan WordPress.com may ask you to upgrade first. Application passwords belong to a single site: one created on another of your sites won't work here."
VideoPress.AddSite.StepsWordPressCom="<ol><li>Click the button above to open Application Passwords on your site and activate them. Wait until WordPress.com says the site is ready.</li><li>On your profile, create a new application password named <i>OBS</i>.</li><li>Paste it below, together with your username, and click Connect.</li></ol>"
VideoPress.AddSite.NotActivatedYet="%1 is a WordPress.com site without application passwords, so it can't accept one yet. Application passwords belong to a single site: one created on another of your sites won't work here. Activate them with the button above (this moves the site to WordPress.com's managed hosting), or go Back and enter the site where you created the password."
VideoPress.AddSite.PasswordsMaybeOff="<p><b>Note:</b> this site doesn't advertise application passwords, so they may be turned off. Enable them on the page above.</p>"
